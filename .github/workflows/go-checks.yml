name: Go checks
permissions:
  contents: read

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set Go cache date
        shell: bash
        run: echo "GO_CACHE_DATE=$(TZ='America/Los_Angeles' date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: |
          go mod download
          go mod tidy -diff

      - name: Restore Go compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
          # always grab from the restore-keys pattern below,
          # like Linux-go-$hash-YYYY-MM-DD as saved by CI
          key: nonexistent
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ env.GO_CACHE_DATE }}
            ${{ runner.os }}-go-${{ env.GO_CACHE_DATE }}
            ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-

      - name: Generate mocks
        run: make generate

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.5

      - name: Run tests + race condition check
        run: make race

      - name: Check Go files are properly formatted
        run: test -z $(gofmt -l .)

      - name: Save Go cache
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # Caches the compiled build cache.
          path: |
            ~/.cache/go-build
          # Save to eg Linux-go-$hash-YYYY-MM-DD to keep the cache fresh
          key: "${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ env.GO_CACHE_DATE }}"

      - name: Save Go cache (today)
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # Caches the compiled build cache.
          path: |
            ~/.cache/go-build
          # Save to eg Linux-go-YYYY-MM-DD as fallback
          key: "${{ runner.os }}-go-${{ env.GO_CACHE_DATE }}"
